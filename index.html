<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="Shadh Music — premium claymorphic YouTube music player.">
  <title>Shadh Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="grid-glow"></div>

  <div class="app-shell">
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div><div class="brand-name">Shadh</div><div class="brand-sub">Music</div></div>
      </div>
      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>Home</span></button>
        <button class="nav-item" data-view="discover"><span class="nav-icon">⌕</span><span>Discover</span></button>
        <button class="nav-item" data-view="library"><span class="nav-icon">▣</span><span>Library</span></button>
        <button class="nav-item" data-view="liked"><span class="nav-icon">♡</span><span>Liked</span><span class="nav-count" id="likedCount">0</span></button>
        <button class="nav-item" data-view="history"><span class="nav-icon">◷</span><span>History</span></button>
      </nav>
      <div class="sidebar-section">
        <div class="section-label">PLAYLISTS</div>
        <div id="sidebarPlaylists" class="playlist-list"></div>
        <button class="new-playlist" id="newPlaylistBtn">＋ New playlist</button>
      </div>
      <div class="sidebar-footer">
        <button class="nav-item" id="settingsBtn"><span class="nav-icon">⚙</span><span>Settings</span></button>
        <button class="nav-item" id="apiBtn"><span class="nav-icon">⌘</span><span>Connect YouTube</span></button>
      </div>
    </aside>

    <main class="main-column">
      <header class="topbar">
        <button class="icon-btn glass-soft mobile-menu" id="mobileMenuBtn" aria-label="Open menu">☰</button>
        <div class="search-wrap glass">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="Search songs, artists, albums, mixes…" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="searchClearBtn" aria-label="Clear search">×</button>
          <button class="search-shortcut" id="focusSearchBtn">⌘ K</button>
          <div class="search-suggestions glass" id="searchSuggestions" hidden></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn glass-soft" id="sleepBtn" title="Sleep timer">◒</button>
          <button class="icon-btn glass-soft" id="themeBtn" title="Toggle theme">◐</button>
          <button class="avatar" id="profileBtn" title="Profile">S</button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>

    <aside class="queue-panel glass" id="queuePanel">
      <div class="queue-header">
        <div><div class="eyebrow">UP NEXT</div><h2>Queue</h2></div>
        <div class="queue-head-actions"><span id="queueCount" class="pill">0</span><button class="text-btn" id="clearQueueBtn">Clear</button></div>
      </div>
      <div class="queue-list" id="queueList"></div>
      <div class="queue-footer">
        <button class="wide-btn" id="shuffleQueueBtn">⤨ <span>Shuffle queue</span></button>
      </div>
    </aside>
  </div>

  <div class="mobile-nav glass" id="mobileNav">
    <button data-view="home">⌂<span>Home</span></button>
    <button data-view="discover">⌕<span>Discover</span></button>
    <button data-view="library">▣<span>Library</span></button>
    <button data-view="liked">♡<span>Liked</span></button>
  </div>

  <div class="player glass-player" id="playerBar">
    <div class="player-meta" id="playerMeta">
      <div id="miniArtWrap"><div class="mini-art placeholder-art">♪</div></div>
      <div class="player-text"><div id="playerTitle" class="player-title">Nothing playing</div><div id="playerChannel" class="player-channel">Choose a track to start</div></div>
      <button class="icon-btn heart-btn" id="playerLikeBtn" title="Like">♡</button>
    </div>
    <div class="player-center">
      <div class="transport">
        <button class="player-btn" id="shuffleBtn" title="Shuffle">⤨</button>
        <button class="player-btn" id="prevBtn" title="Previous">◀◀</button>
        <button class="play-btn" id="playPauseBtn" title="Play">▶</button>
        <button class="player-btn" id="nextBtn" title="Next">▶▶</button>
        <button class="player-btn" id="repeatBtn" title="Repeat">↻</button>
      </div>
      <div class="progress-row"><span id="currentTime">0:00</span><input id="progressRange" type="range" min="0" max="1000" value="0" aria-label="Playback progress"><span id="duration">0:00</span></div>
    </div>
    <div class="player-right">
      <button class="player-btn" id="muteBtn" title="Mute">◖</button>
      <div class="volume-control"><input id="volumeRange" type="range" min="0" max="100" value="80" aria-label="Volume"></div>
      <button class="player-btn" id="queueToggleBtn" title="Queue">☷</button>
      <button class="player-btn" id="nowPlayingBtn" title="Now playing">▣</button>
    </div>
  </div>

  <div class="youtube-host" id="youtubeHost" aria-hidden="true"><div id="youtubePlayer"></div></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
